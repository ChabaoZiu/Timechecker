```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间感应温馨提示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        .font-mono-clock {
            font-family: 'Share Tech Mono', monospace;
        }
        /* 唯美的背景渐变流动动画 */
        .animate-gradient {
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center transition-colors duration-1000 select-none">

    <main class="flex-1 flex flex-col items-center justify-center p-4">
        <div id="status-card" class="w-full max-w-md p-8 md:p-10 rounded-[32px] shadow-2xl backdrop-blur-xl border border-white/10 text-center transform transition-all duration-700 hover:scale-[1.01]">
            
            <div id="time-icon" class="w-24 h-24 mx-auto mb-8 flex items-center justify-center rounded-full transition-all duration-700">
                </div>

            <h1 id="time-message" class="text-3xl md:text-4xl font-black tracking-tight mb-6 drop-shadow-sm transition-all duration-500 whitespace-pre-line text-center leading-relaxed">
                正在感知时间...
            </h1>

            <div class="bg-black/30 py-4 px-8 rounded-2xl inline-block mb-2 border border-white/5 shadow-inner">
                <p class="text-[10px] uppercase tracking-widest text-slate-500 mb-1 font-medium">扫码设备当前时间</p>
                <p id="current-time" class="text-4xl md:text-5xl font-mono-clock font-bold tracking-wider transition-colors duration-500">
                    00:00:00
                </p>
                <p id="current-date" class="text-xs text-slate-400 mt-1.5 tracking-wide">
                    2026年--月--日
                </p>
            </div>
        </div>
    </main>

    <script>
        // 预设高颜值静态图标
        const icons = {
            night: `
                <svg class="w-14 h-14 text-amber-300 drop-shadow-[0_0_15px_rgba(251,191,36,0.4)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    <path fill="currentColor" d="M18 4l.5 1 .9.1-.7.6.2.9-.9-.5-.9.5.2-.9-.7-.6.9-.1.5-1z"></path>
                    <path fill="currentColor" d="M5 13l.3.7.7.1-.5.5.1.7-.6-.4-.6.4.1-.7-.5-.5.7-.1.3-.7z"></path>
                    <path fill="currentColor" d="M12 19l.3.5.5.1-.4.4.1.5-.5-.3-.5.3.1-.5-.4-.4.5-.1.3-.5z"></path>
                </svg>`,
            day: `
                <svg class="w-14 h-14 text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.4)]" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <g style="transform-origin: 12px 12px;">
                        <circle cx="12" cy="12" r="4" stroke-width="1.2"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="
                            M12 3v2.5
                            M12 18.5v2.5
                            M3 12h2.5
                            M18.5 12H21
                            M6 6l1.77 1.77
                            M16.23 16.23l1.77 1.77
                            M18 6l-1.77 1.77
                            M6 18l1.77-1.77
                        "></path>
                    </g>
                </svg>`
        };

        function checkTimeAndRefreshUI() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            // 1. 更新时钟
            document.getElementById('current-time').innerText = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
            
            // 2. 更新日期
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            document.getElementById('current-date').innerText = `${year}年${month}月${date}日 ${weekDays[now.getDay()]}`;

            // 3. 时间状态逻辑划分（更新为7个全新时段）
            // 判断是否处于夜间整体色调（23点 - 早上6点前）
            const isNightTheme = (hours >= 23 || hours < 6);

            // 获取页面元素
            const body = document.body;
            const card = document.getElementById('status-card');
            const iconContainer = document.getElementById('time-icon');
            const message = document.getElementById('time-message');
            const clockText = document.getElementById('current-time');

            // 预设标语容器
            let greeting = "";

            // 根据 24 小时进行精准匹配切换
            if (hours >= 23 || hours < 3) {
                // 23:00 - 02:59 深夜
                greeting = "已经很晚了，\n记得早点睡呀！";
            } else if (hours >= 3 && hours < 6) {
                // 03:00 - 05:59 黎明（新切分时段）
                greeting = "要天亮了，\n是熬穿还是早起了？";
            } else if (hours >= 6 && hours < 9) {
                // 06:00 - 08:59 清晨
                greeting = "早上好，\n又是新的一天了~";
            } else if (hours >= 9 && hours < 12) {
                // 09:00 - 11:59 上午
                greeting = "上午好呀，\n你在干什么呢？";
            } else if (hours >= 12 && hours < 14) {
                // 12:00 - 13:59 中午/午休
                greeting = "有没有犯困，\n可以趴一会哦~";
            } else if (hours >= 14 && hours < 18) {
                // 14:00 - 17:59 下午
                greeting = "一天又要过去了，\n有没有想我？";
            } else if (hours >= 18 && hours < 23) {
                // 18:00 - 22:59 晚上
                greeting = "晚上好晚上好，\n可以放松一下！";
            }

            // 4. 根据主视觉模式应用主题样式
            if (isNightTheme) {
                // 🌙 深夜 & 黎明 视觉渲染（星空紫主题）
                body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center transition-colors duration-1000 animate-gradient bg-gradient-to-b from-slate-950 via-slate-900 to-indigo-950 select-none";
                card.className = "w-full max-w-md p-8 md:p-10 rounded-[32px] border border-indigo-500/10 text-center transition-all duration-700 bg-slate-900/40 shadow-[0_0_50px_rgba(99,102,241,0.12)] mx-auto";
                
                iconContainer.innerHTML = icons.night;
                iconContainer.className = "w-20 h-20 mx-auto mb-8 flex items-center justify-center rounded-full bg-indigo-500/10";
                
                message.innerText = greeting;
                message.className = "text-3xl md:text-4xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-300 to-amber-500 drop-shadow whitespace-pre-line text-center leading-relaxed";
                
                clockText.className = "text-4xl md:text-5xl font-mono-clock font-bold tracking-wider text-amber-400";
            } else {
                // ☀️ 白天 5 个时段的视觉渲染（翡翠绿主题）
                body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center transition-colors duration-1000 animate-gradient bg-gradient-to-b from-slate-900 via-slate-850 to-emerald-950 select-none";
                card.className = "w-full max-w-md p-8 md:p-10 rounded-[32px] border border-emerald-500/10 text-center transition-all duration-700 bg-slate-800/30 shadow-[0_0_50px_rgba(16,185,129,0.08)] mx-auto";
                
                iconContainer.innerHTML = icons.day;
                iconContainer.className = "w-20 h-20 mx-auto mb-8 flex items-center justify-center rounded-full bg-emerald-500/5";
                
                message.innerText = greeting;
                message.className = "text-3xl md:text-4xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 via-teal-300 to-cyan-400 drop-shadow whitespace-pre-line text-center leading-relaxed";
                
                clockText.className = "text-4xl md:text-5xl font-mono-clock font-bold tracking-wider text-emerald-400";
            }
        }

        // 立即执行并维持每秒自动刷新
        window.onload = function() {
            checkTimeAndRefreshUI();
            setInterval(checkTimeAndRefreshUI, 1000);
        };
    </script>
</body>
</html>


```
